spring:
  application:
    name: account-service
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/minibank
          jwk-set-uri: http://localhost:8180/realms/minibank/protocol/openid-connect/certs

management:
  endpoints:
    web:
      exposure:
        include: health

