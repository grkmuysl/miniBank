server:
  port: 8081
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  task:
    scheduling:
      shutdown:
        # Let a running scheduled job (e.g. the outbox poller in the middle of a send) finish.
        await-termination: true
        await-termination-period: 10s
  application:
    name: transfer-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/transferdb}
    username: ${DB_USERNAME:transfer_app}
    password: ${DB_PASSWORD:local_dev_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      # Incoming requests: validate the customer's token
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/minibank
          jwk-set-uri: http://localhost:8180/realms/minibank/protocol/openid-connect/certs
          audiences: transfer-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Broker confirms only after all in-sync replicas have the message.
      properties:
        # Fail fast when the broker is unreachable instead of blocking the shared scheduler thread for 60s.
        max.block.ms: 5000
      acks: all
    consumer:
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # A brand-new consumer group starts from the beginning of the topic, not from "now".
      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        include: health


transfer:
  saga:
    fraud-timeout: ${TRANSFER_FRAUD_TIMEOUT:5m}
    stuck-threshold: 10m

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"