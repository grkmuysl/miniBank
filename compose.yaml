services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_dev_admin
    ports:
      - "5433:5432"            # dev convenience only; closed in a real environment
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d frauddb"]
      interval: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev
    environment:
      KC_HOSTNAME: http://localhost:8180
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"            # clients must reach Keycloak to log in
    volumes:
      - keycloak-data:/opt/keycloak/data

  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "9094:9094"            # EXTERNAL listener, for apps running in the IDE
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  kafka-ui:
    image: kafbat/kafka-ui:latest
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: minibank
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  account-service:
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: account-service/Dockerfile
    profiles: ["app"]
    # no "ports": reachable only from inside the compose network
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/accountdb
      SPRING_DATASOURCE_USERNAME: account_app
      SPRING_DATASOURCE_PASSWORD: local_dev_only
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/minibank/protocol/openid-connect/certs
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      keycloak:
        condition: service_started

  transfer-service:
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: transfer-service/Dockerfile
    profiles: ["app"]
    # no "ports"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/transferdb
      SPRING_DATASOURCE_USERNAME: transfer_app
      SPRING_DATASOURCE_PASSWORD: local_dev_only
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/minibank/protocol/openid-connect/certs
      # Outgoing calls (east-west): straight to account-service over the internal network
      ACCOUNT_SERVICE_URL: http://account-service:8080
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/minibank/protocol/openid-connect/token
      ACCOUNT_CLIENT_SECRET: ${ACCOUNT_CLIENT_SECRET:?ACCOUNT_CLIENT_SECRET is not set; add it to .env}
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      keycloak:
        condition: service_started

  fraud-service:
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: fraud-service/Dockerfile
    profiles: [ "app" ]
    # no "ports": only Kafka talks to it
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/frauddb
      SPRING_DATASOURCE_USERNAME: fraud_app
      SPRING_DATASOURCE_PASSWORD: local_dev_only
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
  api-gateway:
    stop_grace_period: 30s
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    profiles: ["app"]
    ports:
      - "8000:8000"            # the only entry point for API traffic
    environment:
      ACCOUNT_SERVICE_URL: http://account-service:8080
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/minibank/protocol/openid-connect/token
      ACCOUNT_CLIENT_SECRET: ${ACCOUNT_CLIENT_SECRET:?...}
    depends_on:
      - account-service
      - transfer-service

volumes:
  pgdata:
  keycloak-data: