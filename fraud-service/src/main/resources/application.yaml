server:
  port: 8082

spring:
  application:
    name: fraud-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/frauddb}
    username: ${DB_USERNAME:fraud_app}
    password: ${DB_PASSWORD:local_dev_only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        max.block.ms: 5000
    consumer:
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

fraud:
  # Max amount of a single transfer, per currency. A currency missing here is rejected (fail-closed).
  amount-limit:
    TRY: 50000
    USD: 1500
    EUR: 1400
  # Max amount to a beneficiary this customer has never been approved for before.
  new-beneficiary-limit:
    TRY: 10000
    USD: 300
    EUR: 280
  velocity:
    max-checks: 3      # a 4th transfer within the window is rejected
    window: 10m